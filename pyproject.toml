[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tdock"
dynamic = ["version"]
description = "A terminal UI for managing Docker containers on GPU servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TaeinYoon" }]
keywords = ["docker", "tui", "gpu", "containers", "textual"]
requires-python = ">=3.9"
dependencies = ["textual>=8.2,<9"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: System :: Systems Administration",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Taepoung/tdock"
Repository = "https://github.com/Taepoung/tdock"
Issues = "https://github.com/Taepoung/tdock/issues"

[project.scripts]
tdock = "tdock.app:main"

[tool.setuptools.dynamic]
version = { attr = "tdock.__version__" }
